<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151a">
<title>Agenda</title>
<script>
(function(){
  try{
    const c=document.createElement('canvas');c.width=512;c.height=512;
    const ctx=c.getContext('2d');
    const r=110;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(512-r,0);ctx.quadraticCurveTo(512,0,512,r);ctx.lineTo(512,512-r);ctx.quadraticCurveTo(512,512,512-r,512);ctx.lineTo(r,512);ctx.quadraticCurveTo(0,512,0,512-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
    const bg=ctx.createLinearGradient(0,0,512,512);bg.addColorStop(0,'#1e242c');bg.addColorStop(1,'#12151a');ctx.fillStyle=bg;ctx.fill();
    const glow=ctx.createRadialGradient(256,230,30,256,230,240);glow.addColorStop(0,'rgba(224,160,57,0.32)');glow.addColorStop(1,'rgba(224,160,57,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(256,230,240,0,Math.PI*2);ctx.fill();
    ctx.font='250px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗓️',256,270);
    ctx.beginPath();ctx.arc(256,256,248,0,Math.PI*2);ctx.strokeStyle='rgba(224,160,57,0.35)';ctx.lineWidth=6;ctx.stroke();
    const lnk=document.createElement('link');lnk.rel='apple-touch-icon';lnk.href=c.toDataURL('image/png');document.head.appendChild(lnk);
    const fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=c.toDataURL('image/png');document.head.appendChild(fav);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#12151a;
  --bg-elev:#181c22;
  --surface:#1e242c;
  --surface-2:#262d37;
  --border:#2b323c;
  --border-soft:#232a33;
  --text:#eae7e0;
  --text-dim:#9099a6;
  --text-faint:#5c6673;
  --accent:#e0a039;
  --accent-strong:#f0b453;
  --accent-soft:rgba(224,160,57,.14);
  --good:#5fb894;
  --good-soft:rgba(95,184,148,.14);
  --danger:#d9634a;
  --danger-soft:rgba(217,99,74,.14);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{height:100%;touch-action:manipulation;}
body{
  margin:0;
  background:
    radial-gradient(1px 1px at 20% 15%, rgba(224,160,57,.35) 0, transparent 100%),
    radial-gradient(1px 1px at 70% 8%, rgba(234,231,224,.25) 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 85% 22%, rgba(234,231,224,.2) 0, transparent 100%),
    radial-gradient(1px 1px at 45% 30%, rgba(234,231,224,.15) 0, transparent 100%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#333c47;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
a{color:inherit;}

#app{display:flex;min-height:100vh;}

/* ---------------- SIDEBAR ---------------- */
#sidebar{
  width:290px;min-width:290px;background:var(--bg-elev);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;
}
.brand{padding:22px 20px 14px;border-bottom:1px solid var(--border-soft);padding-top:calc(22px + env(safe-area-inset-top));}
.brand .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
.brand h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:26px;margin:4px 0 2px;}
.brand p{margin:0;font-size:12.5px;color:var(--text-dim);}

#quickAddBtn{
  margin:16px 20px 6px;background:var(--accent);color:#221602;border:none;padding:11px 14px;
  border-radius:var(--radius);font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:8px;transition:background .15s ease,transform .1s ease;
}
#quickAddBtn:hover{background:var(--accent-strong);}
#quickAddBtn:active{transform:scale(.98);}

.side-scroll{flex:1;overflow-y:auto;padding:6px 0 10px;}
.side-section{padding:14px 20px 6px;}
.side-section h3{
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);
  margin:0 0 10px;font-weight:700;display:flex;align-items:center;justify-content:space-between;
}
.side-section h3 .count{font-family:var(--font-mono);color:var(--text-dim);font-weight:500;}
.task-mini{
  display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:8px;margin-bottom:4px;
  cursor:pointer;transition:background .12s ease;border:1px solid transparent;
}
.task-mini:hover{background:var(--surface);border-color:var(--border-soft);}
.task-mini .chk{
  width:16px;height:16px;border-radius:5px;border:1.5px solid var(--text-faint);flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:all .12s ease;
}
.task-mini .chk:hover{border-color:var(--accent);}
.task-mini.done .chk{background:var(--good);border-color:var(--good);}
.task-mini.done .chk::after{content:'✓';color:#0d1a14;font-size:10.5px;font-weight:700;}
.task-mini .tbody{flex:1;min-width:0;}
.task-mini .ttext{font-size:13px;line-height:1.4;word-break:break-word;}
.note-flag{font-size:10px;opacity:.7;}
.task-mini.done .ttext{color:var(--text-faint);text-decoration:line-through;}
.task-mini .tmeta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:2px;}
.task-mini.overdue .tmeta{color:var(--danger);}
.task-mini .tdel{opacity:0;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0;}
.task-mini:hover .tdel{opacity:1;}
.task-mini .tdel:hover{color:var(--danger);}
.empty-mini{font-size:12px;color:var(--text-faint);padding:4px 9px 10px;line-height:1.5;}

.side-section h3{cursor:pointer;user-select:none;}
.side-section h3 .h3-title{display:flex;align-items:center;gap:6px;}
.side-section h3 .chev{font-size:9px;transition:transform .15s ease;color:var(--text-faint);display:inline-block;}
.side-section.collapsed h3 .chev{transform:rotate(-90deg);}
.side-section.collapsed .section-body{display:none;}

.task-mini{cursor:grab;}
.task-mini:active{cursor:grabbing;}
.drag-over{outline:2px dashed var(--accent) !important;outline-offset:-3px;background:var(--accent-soft) !important;}
.section-body.drag-over{border-radius:8px;padding-top:4px;padding-bottom:4px;}

.sidebar-footer{padding:14px 20px 20px;border-top:1px solid var(--border-soft);padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.save-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.save-note .dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
.footer-row{display:flex;gap:8px;}
.footer-btn{
  flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 6px;
  border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:5px;transition:background .12s ease;
}
.footer-btn:hover{background:var(--surface-2);}

/* ---------------- MAIN ---------------- */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border-soft);
  gap:16px;flex-wrap:wrap;padding-top:calc(20px + env(safe-area-inset-top));
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.nav-arrows{display:flex;gap:4px;}
.nav-arrows button{
  width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
}
.nav-arrows button:hover{background:var(--surface-2);}
#periodLabel{font-family:var(--font-display);font-style:italic;font-size:22px;font-weight:600;min-width:190px;}
#todayBtn{
  background:none;border:1px solid var(--border);color:var(--text-dim);padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;
}
#todayBtn:hover{color:var(--text);border-color:var(--accent);}
.view-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px;}
.view-toggle button{
  border:none;background:none;color:var(--text-dim);padding:6px 14px;border-radius:6px;font-size:12.5px;
  font-weight:600;cursor:pointer;
}
.view-toggle button.active{background:var(--accent);color:#221602;}

#calendarWrap{flex:1;overflow-y:auto;padding:20px 28px 40px;}

/* Month grid */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}
.month-weekday{
  background:var(--bg-elev);text-align:center;padding:9px 0;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-faint);font-weight:700;border-bottom:1px solid var(--border-soft);
}
.month-cell{
  min-height:104px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);
  padding:8px;cursor:pointer;transition:background .12s ease;position:relative;
}
.month-cell:hover{background:var(--surface);}
.month-cell:nth-child(7n){border-right:none;}
.month-cell.outside{opacity:.32;}
.month-cell .dnum{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.month-cell.today .dnum{
  background:var(--accent);color:#221602;width:20px;height:20px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-weight:700;
}
.dots-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.tdot.done{background:var(--good);opacity:.6;}
.tdot.overdue{background:var(--danger);}
.more-count{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin-top:3px;}

/* Week / agenda view */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.week-col{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:12px 10px;min-height:220px;}
.week-col.today{border-color:var(--accent);}
.week-col .wchead{text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
.week-col .wcday{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:700;}
.week-col .wcnum{font-family:var(--font-display);font-style:italic;font-size:19px;font-weight:600;margin-top:2px;}
.week-col.today .wcnum{color:var(--accent);}
.wc-addbtn{
  width:100%;background:none;border:1px dashed var(--border);color:var(--text-faint);padding:6px;border-radius:7px;
  font-size:11px;cursor:pointer;margin-top:6px;
}
.wc-addbtn:hover{color:var(--accent);border-color:var(--accent);}

@media (max-width:980px){
  .week-grid{grid-template-columns:1fr;}
  .week-col{min-height:0;}
}

/* ---------------- MODALS ---------------- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(8,10,13,.6);backdrop-filter:blur(2px);
  z-index:60;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;width:100%;max-width:440px;
  max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
.modal-head h2{font-family:var(--font-display);font-style:italic;font-size:19px;margin:0;font-weight:600;}
.modal-close{background:none;border:none;color:var(--text-faint);font-size:18px;cursor:pointer;padding:4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input[type=text],.field input[type=date],.field input[type=time],.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;
  border-radius:8px;font-size:13.5px;outline:none;box-sizing:border-box;
}
.field input[type=date],.field input[type=time]{
  -webkit-appearance:none;appearance:none;min-width:0;max-width:100%;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
@media (max-width:420px){
  .field-row{flex-direction:column;gap:14px;}
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#221602;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:none;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:none;color:var(--danger);border:1px solid var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);}

.day-tasklist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.day-empty{font-size:12.5px;color:var(--text-faint);padding:8px 0;}

#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);
  border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:9px;font-size:13px;
  opacity:0;transition:all .2s ease;z-index:80;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#mobileMenuBtn{
  display:none;position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:45;width:38px;height:38px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:16px;
  align-items:center;justify-content:center;cursor:pointer;
}
#sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(8,10,13,.55);z-index:39;}
body.sidebar-open #sidebarOverlay{display:block;}
body.sidebar-open #mobileMenuBtn{display:none;}

@media (max-width:860px){
  #mobileMenuBtn{display:flex;}
  #sidebar{position:fixed;left:-300px;top:0;bottom:0;z-index:40;transition:left .2s ease;}
  body.sidebar-open #sidebar{left:0;}
  #topbar{padding:calc(16px + env(safe-area-inset-top)) 16px 16px 62px;}
  #calendarWrap{padding:14px 14px 40px;}
  .month-cell{min-height:74px;padding:5px;}
  #periodLabel{font-size:18px;min-width:0;}
}
</style>
</head>
<body>
<button id="mobileMenuBtn" onclick="document.body.classList.toggle('sidebar-open')">☰</button>
<div id="sidebarOverlay" onclick="document.body.classList.remove('sidebar-open')"></div>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">Agenda perso</div>
      <h1>Mes tâches</h1>
      <p id="statLine">—</p>
    </div>
    <button id="quickAddBtn" onclick="openTaskModal()">+ Nouvelle tâche</button>
    <div class="side-scroll">
      <div class="side-section collapsed" id="secOverdue">
        <h3 onclick="toggleSection('secOverdue')"><span class="h3-title">En retard <span class="chev">▾</span></span> <span class="count" id="cntOverdue">0</span></h3>
        <div id="listOverdue" class="section-body"></div>
      </div>
      <div class="side-section collapsed" id="secToday">
        <h3 onclick="toggleSection('secToday')"><span class="h3-title">Aujourd'hui <span class="chev">▾</span></span> <span class="count" id="cntToday">0</span></h3>
        <div id="listToday" class="section-body" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropSection(event,'today')"></div>
      </div>
      <div class="side-section collapsed" id="secUpcoming">
        <h3 onclick="toggleSection('secUpcoming')"><span class="h3-title">À venir <span class="chev">▾</span></span> <span class="count" id="cntUpcoming">0</span></h3>
        <div id="listUpcoming" class="section-body" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropSection(event,'upcoming')"></div>
      </div>
      <div class="side-section collapsed" id="secNoDate">
        <h3 onclick="toggleSection('secNoDate')"><span class="h3-title">Sans date <span class="chev">▾</span></span> <span class="count" id="cntNoDate">0</span></h3>
        <div id="listNoDate" class="section-body" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropSection(event,'nodate')"></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="save-note"><span class="dot"></span> Sauvegardé sur cet appareil</div>
      <button class="footer-btn" style="width:100%;margin-bottom:8px" onclick="openHistoryModal()">🕘 Historique</button>
      <div class="footer-row">
        <button class="footer-btn" onclick="exportData()">⭳ Export</button>
        <button class="footer-btn" onclick="document.getElementById('importFile').click()">⭱ Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this.files[0])">
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div class="topbar-left">
        <div class="nav-arrows">
          <button onclick="navigate(-1)">‹</button>
          <button onclick="navigate(1)">›</button>
        </div>
        <div id="periodLabel">—</div>
        <button id="todayBtn" onclick="goToday()">Aujourd'hui</button>
      </div>
      <div class="view-toggle">
        <button id="btnMonth" class="active" onclick="setView('month')">Mois</button>
        <button id="btnWeek" onclick="setView('week')">Semaine</button>
      </div>
    </div>
    <div id="calendarWrap"></div>
  </main>
</div>

<!-- Day modal -->
<div class="modal-overlay" id="dayModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="dayModalTitle">Jour</h2>
      <button class="modal-close" onclick="closeModal('dayModalOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="day-tasklist" id="dayTaskList" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropDate(event,currentDayModalDate)"></div>
      <button class="btn btn-primary" style="width:100%" onclick="openTaskModal(currentDayModalDate)">+ Ajouter une tâche ce jour</button>
    </div>
  </div>
</div>

<!-- History modal -->
<div class="modal-overlay" id="historyModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Historique</h2>
      <button class="modal-close" onclick="closeModal('historyModalOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="day-tasklist" id="historyTaskList"></div>
    </div>
  </div>
</div>

<!-- New/edit task modal -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="taskModalTitle">Nouvelle tâche</h2>
      <button class="modal-close" onclick="closeModal('taskModalOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Titre</label>
        <input type="text" id="fTitle" placeholder="Ex : Appeler le plombier">
      </div>
      <div class="field">
        <label>Note (optionnel)</label>
        <textarea id="fNote" rows="3" placeholder="Détails, contexte, liens…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date</label>
          <input type="date" id="fDate">
        </div>
        <div class="field">
          <label>Heure (optionnel)</label>
          <input type="time" id="fTime">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="taskDeleteBtn" style="display:none;margin-right:auto" onclick="deleteCurrentTask()">Supprimer</button>
        <button class="btn btn-ghost" onclick="closeModal('taskModalOverlay')">Annuler</button>
        <button class="btn btn-primary" onclick="saveTaskFromModal()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================= STATE & STORAGE ============================= */
const STORAGE_KEY = 'agendaPerso:v1';
let tasks = [];
let view = 'month'; // 'month' | 'week'
let cursorDate = new Date(); // reference date for navigation
let currentDayModalDate = null;
let editingTaskId = null;
let draggedTaskId = null;

function loadTasks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    const list = Array.isArray(parsed.tasks) ? parsed.tasks : [];
    // migration : anciennes tâches stockées avec un seul champ "text"
    list.forEach(t => {
      if(t.title === undefined){
        t.title = t.text || '';
        t.note = t.note || '';
        delete t.text;
      }
    });
    return list;
  }catch(e){ return []; }
}
function saveTasks(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ version:1, tasks }));
}
function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================= DATE HELPERS ============================= */
const WEEKDAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function pad(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return toISODate(new Date()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function mondayOf(d){
  const nd = new Date(d);
  const day = (nd.getDay()+6)%7; // 0 = Monday
  nd.setDate(nd.getDate()-day);
  nd.setHours(0,0,0,0);
  return nd;
}
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function addMonths(d,n){ const nd=new Date(d); nd.setMonth(nd.getMonth()+n); return nd; }

/* ============================= TASK QUERIES ============================= */
function tasksForDate(iso){
  return tasks.filter(t => t.date === iso).sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
}
function isOverdue(t){
  return t.date && !t.done && t.date < todayISO();
}

/* ============================= RENDER: SIDEBAR ============================= */
function renderSidebar(){
  const overdue = tasks.filter(isOverdue).sort((a,b)=>a.date.localeCompare(b.date));
  const today = tasksForDate(todayISO());
  const upcoming = tasks.filter(t => t.date && t.date > todayISO() && !t.done)
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.time||'99:99').localeCompare(b.time||'99:99'));
  const noDate = tasks.filter(t => !t.date).sort((a,b)=> (a.done?1:0)-(b.done?1:0));

  document.getElementById('cntOverdue').textContent = overdue.length;
  document.getElementById('cntToday').textContent = today.length;
  document.getElementById('cntUpcoming').textContent = upcoming.length;
  document.getElementById('cntNoDate').textContent = noDate.length;

  renderMiniList('listOverdue', overdue, { showDate:true, overdueStyle:true });
  renderMiniList('listToday', today, { showTime:true });
  renderMiniList('listUpcoming', upcoming, { showDate:true });
  renderMiniList('listNoDate', noDate, {});

  const remaining = tasks.filter(t=>!t.done).length;
  document.getElementById('statLine').textContent = remaining === 0 ? 'Tout est fait ✓' : `${remaining} tâche${remaining>1?'s':''} en cours`;
}

function renderMiniList(containerId, list, opts){
  const el = document.getElementById(containerId);
  if(list.length === 0){
    el.innerHTML = `<div class="empty-mini">Rien ici.</div>`;
    return;
  }
  el.innerHTML = list.map(t => taskMiniHtml(t, opts)).join('');
}

function formatShortDate(d){
  return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3).toLowerCase()}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= RENDER: CALENDAR ============================= */
function renderTopbar(){
  document.getElementById('btnMonth').classList.toggle('active', view==='month');
  document.getElementById('btnWeek').classList.toggle('active', view==='week');
  if(view === 'month'){
    document.getElementById('periodLabel').textContent = `${MONTHS[cursorDate.getMonth()]} ${cursorDate.getFullYear()}`;
  } else {
    const mon = mondayOf(cursorDate);
    const sun = addDays(mon,6);
    const sameMonth = mon.getMonth() === sun.getMonth();
    document.getElementById('periodLabel').textContent = sameMonth
      ? `${mon.getDate()}–${sun.getDate()} ${MONTHS[mon.getMonth()]}`
      : `${mon.getDate()} ${MONTHS[mon.getMonth()].slice(0,3)} – ${sun.getDate()} ${MONTHS[sun.getMonth()].slice(0,3)}`;
  }
}

function renderCalendar(){
  renderTopbar();
  const wrap = document.getElementById('calendarWrap');
  if(view === 'month') wrap.innerHTML = buildMonthGrid();
  else wrap.innerHTML = buildWeekGrid();
}

function buildMonthGrid(){
  const year = cursorDate.getFullYear(), month = cursorDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = mondayOf(firstOfMonth);
  const todayS = todayISO();

  let html = `<div class="month-grid">`;
  WEEKDAYS.forEach(w => html += `<div class="month-weekday">${w}</div>`);

  for(let i=0; i<42; i++){
    const d = addDays(gridStart, i);
    const iso = toISODate(d);
    const outside = d.getMonth() !== month;
    const dayTasks = tasksForDate(iso);
    const isToday = iso === todayS;

    let dots = '';
    dayTasks.slice(0,4).forEach(t => {
      const cls = t.done ? 'done' : (isOverdue(t) ? 'overdue' : '');
      dots += `<div class="tdot ${cls}"></div>`;
    });
    const more = dayTasks.length > 4 ? `<div class="more-count">+${dayTasks.length-4}</div>` : '';

    html += `
      <div class="month-cell ${outside?'outside':''} ${isToday?'today':''}" onclick="openDayModal('${iso}')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropDate(event,'${iso}')">
        <span class="dnum">${d.getDate()}</span>
        <div class="dots-row">${dots}</div>
        ${more}
      </div>`;
    if(i === 41) break;
  }
  html += `</div>`;
  return html;
}

function buildWeekGrid(){
  const mon = mondayOf(cursorDate);
  const todayS = todayISO();
  let html = `<div class="week-grid">`;
  for(let i=0;i<7;i++){
    const d = addDays(mon,i);
    const iso = toISODate(d);
    const isToday = iso === todayS;
    const dayTasks = tasksForDate(iso);
    html += `
      <div class="week-col ${isToday?'today':''}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');onDropDate(event,'${iso}')">
        <div class="wchead" style="cursor:pointer" onclick="openDayModal('${iso}')">
          <div class="wcday">${WEEKDAYS[i]}</div>
          <div class="wcnum">${d.getDate()}</div>
        </div>
        <div class="day-tasklist">
          ${dayTasks.length ? dayTasks.map(t => taskMiniHtml(t)).join('') : '<div class="day-empty">Rien de prévu.</div>'}
        </div>
        <button class="wc-addbtn" onclick="openTaskModal('${iso}')">+ Ajouter</button>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function taskMiniHtml(t, opts){
  opts = opts || {};
  let meta = '';
  if(opts.showDate && t.date) meta = formatShortDate(parseISO(t.date)) + (t.time? ' · '+t.time : '');
  else if(t.time) meta = t.time;
  const hasNote = t.note && t.note.trim().length > 0;
  return `
    <div class="task-mini ${t.done?'done':''} ${isOverdue(t)?'overdue':''}" draggable="true" ondragstart="onDragStart(event,'${t.id}')" onclick="if(event.target.className.indexOf('tdel')<0) openTaskModal(null,'${t.id}')">
      <div class="chk" onclick="event.stopPropagation();toggleTask('${t.id}')"></div>
      <div class="tbody">
        <div class="ttext">${escapeHtml(t.title)}${hasNote ? ' <span class="note-flag" title="A une note">📝</span>' : ''}</div>
        ${meta ? `<div class="tmeta">${meta}</div>` : ''}
      </div>
      <button class="tdel" onclick="event.stopPropagation();removeTask('${t.id}')">✕</button>
    </div>`;
}

/* ============================= NAVIGATION ============================= */
function navigate(delta){
  cursorDate = view === 'month' ? addMonths(cursorDate, delta) : addDays(cursorDate, delta*7);
  renderCalendar();
}
function goToday(){ cursorDate = new Date(); renderCalendar(); }
function setView(v){ view = v; renderCalendar(); }

/* ============================= TASK CRUD ============================= */
function toggleTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  saveTasks(); renderAll();
  refreshHistoryIfOpen();
}
function removeTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  saveTasks(); renderAll();
  refreshHistoryIfOpen();
}

/* ============================= DRAG & DROP ============================= */
function onDragStart(e, id){
  draggedTaskId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
}
function onDropSection(e, section){
  const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  if(section === 'today') t.date = todayISO();
  else if(section === 'upcoming'){ if(!t.date || t.date <= todayISO()) t.date = toISODate(addDays(new Date(),1)); }
  else if(section === 'nodate') t.date = null;
  saveTasks(); renderAll();
  showToast('Tâche déplacée');
}
function onDropDate(e, iso){
  const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
  const t = tasks.find(x=>x.id===id);
  if(!t || !iso) return;
  t.date = iso;
  saveTasks(); renderAll();
  if(document.getElementById('dayModalOverlay').classList.contains('open')) openDayModal(iso);
  showToast('Tâche déplacée au ' + formatShortDate(parseISO(iso)));
}

/* ============================= SECTIONS REPLIABLES ============================= */
function toggleSection(id){
  document.getElementById(id).classList.toggle('collapsed');
}
function collapseAllSections(){
  ['secOverdue','secToday','secUpcoming','secNoDate'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.classList.add('collapsed');
  });
}

/* ============================= MODALS ============================= */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function openDayModal(iso){
  currentDayModalDate = iso;
  const d = parseISO(iso);
  document.getElementById('dayModalTitle').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const list = tasksForDate(iso);
  const listEl = document.getElementById('dayTaskList');
  listEl.innerHTML = list.length ? list.map(t=>taskMiniHtml(t)).join('') : '<div class="day-empty">Aucune tâche ce jour.</div>';
  openModal('dayModalOverlay');
}

function openHistoryModal(){
  const done = tasks.filter(t => t.done).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const el = document.getElementById('historyTaskList');
  el.innerHTML = done.length
    ? done.map(t => taskMiniHtml(t, { showDate:true })).join('')
    : '<div class="day-empty">Aucune tâche terminée pour le moment. Coche une tâche pour qu\'elle atterrisse ici.</div>';
  openModal('historyModalOverlay');
}
function refreshHistoryIfOpen(){
  const modal = document.getElementById('historyModalOverlay');
  if(modal.classList.contains('open')) openHistoryModal();
}

function openTaskModal(prefillDate, taskId){
  editingTaskId = taskId || null;
  const isEdit = !!taskId;
  document.getElementById('taskModalTitle').textContent = isEdit ? 'Modifier la tâche' : 'Nouvelle tâche';
  document.getElementById('taskDeleteBtn').style.display = isEdit ? 'inline-block' : 'none';

  if(isEdit){
    const t = tasks.find(x=>x.id===taskId);
    document.getElementById('fTitle').value = t.title;
    document.getElementById('fNote').value = t.note || '';
    document.getElementById('fDate').value = t.date || '';
    document.getElementById('fTime').value = t.time || '';
  } else {
    document.getElementById('fTitle').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fDate').value = prefillDate || '';
    document.getElementById('fTime').value = '';
  }
  closeModal('dayModalOverlay');
  openModal('taskModalOverlay');
  setTimeout(()=>document.getElementById('fTitle').focus(), 50);
}

function saveTaskFromModal(){
  const title = document.getElementById('fTitle').value.trim();
  const note = document.getElementById('fNote').value.trim();
  const date = document.getElementById('fDate').value || null;
  const time = document.getElementById('fTime').value || null;
  if(!title){ showToast('Ajoute un titre'); return; }

  if(editingTaskId){
    const t = tasks.find(x=>x.id===editingTaskId);
    t.title = title; t.note = note; t.date = date; t.time = time;
  } else {
    tasks.push({ id: uid(), title, note, date, time, done:false, createdAt: Date.now() });
  }
  saveTasks();
  closeModal('taskModalOverlay');
  renderAll();
  showToast('Enregistré');
}

function deleteCurrentTask(){
  if(!editingTaskId) return;
  removeTask(editingTaskId);
  closeModal('taskModalOverlay');
  showToast('Tâche supprimée');
}

/* ============================= TOAST ============================= */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}

/* ============================= EXPORT / IMPORT ============================= */
function exportData(){
  const payload = { version:1, exportedAt: new Date().toISOString(), tasks };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agenda_sauvegarde_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sauvegarde exportée');
}

async function importData(file){
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload || !Array.isArray(payload.tasks)) throw new Error('format invalide');
    payload.tasks.forEach(t => {
      if(t.title === undefined){ t.title = t.text || ''; t.note = t.note || ''; delete t.text; }
    });
    const merge = confirm(`Importer ${payload.tasks.length} tâche(s) ?\nOK = fusionner avec l'existant\nAnnuler = remplacer tout`);
    if(merge){
      const existingIds = new Set(tasks.map(t=>t.id));
      payload.tasks.forEach(t => { if(!existingIds.has(t.id)) tasks.push(t); });
    } else {
      tasks = payload.tasks;
    }
    saveTasks();
    renderAll();
    showToast('Import terminé');
  }catch(e){
    showToast("Échec de l'import : fichier invalide");
  }
  document.getElementById('importFile').value = '';
}

/* ============================= INIT ============================= */
function renderAll(){
  renderSidebar();
  renderCalendar();
}
function init(){
  tasks = loadTasks();
  renderAll();
}
init();

/* Blocage du zoom (pincement + double-tap), notamment pour iOS Safari qui ignore souvent le viewport */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') collapseAllSections();
});
window.addEventListener('pageshow', () => collapseAllSections());

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ closeModal('taskModalOverlay'); closeModal('dayModalOverlay'); closeModal('historyModalOverlay'); }
});
document.getElementById('dayModalOverlay').addEventListener('click', e => { if(e.target.id==='dayModalOverlay') closeModal('dayModalOverlay'); });
document.getElementById('taskModalOverlay').addEventListener('click', e => { if(e.target.id==='taskModalOverlay') closeModal('taskModalOverlay'); });
document.getElementById('historyModalOverlay').addEventListener('click', e => { if(e.target.id==='historyModalOverlay') closeModal('historyModalOverlay'); });
</script>
